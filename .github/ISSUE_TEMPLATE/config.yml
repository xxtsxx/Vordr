# The issue chooser is where someone with a security finding actually lands -
# not SECURITY.md - so the private route is offered here, above the option to
# file publicly.
#
# blank_issues_enabled stays TRUE on purpose.  There are no issue templates, so
# turning it off would leave the chooser showing these links and no way to open
# an issue at all: bug reports would be silently impossible.  The goal is to put
# the private channel in front of a reporter, not to shut the front door.
blank_issues_enabled: true
#
# There is deliberately NO "report a vulnerability" link here: GitHub adds that
# entry itself (the shield icon) because private vulnerability reporting is on and
# SECURITY.md exists.  Listing our own duplicate of it left two near-identical
# rows in the chooser, which makes a reporter hesitate over which one is real.
# The reason it matters is carried below instead.
contact_links:
  - name: Security vulnerabilities - use the private report above, not an issue
    url: https://github.com/xxtsxx/Vordr/blob/master/SECURITY.md
    about: >
      Vordr has no auto-update, so a vulnerability posted publicly is a working
      exploit against every installed copy until each one is updated by hand. Use
      "Report a security vulnerability" above. This policy has the scope, the
      timelines and the disclosure terms.
  - name: My antivirus flags Vordr as malware
    url: https://github.com/xxtsxx/Vordr/blob/master/docs/ANTIVIRUS.md
    about: >
      A known false positive. Vordr is unsigned and new, and a password manager
      necessarily uses the same APIs a credential stealer would. Please read this
      before filing.
  - name: Verify a binary you downloaded
    url: https://github.com/xxtsxx/Vordr/blob/master/docs/RELEASES.md
    about: >
      Every release is reproducible: rebuild the tag and compare the SHA-256
      against the published hash. A mismatch means the binary is not this source.
