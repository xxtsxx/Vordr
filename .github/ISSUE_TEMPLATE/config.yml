# Keep an ordinary bug template available while blank issues are disabled.
# GitHub supplies its private-report entry when private reporting is enabled.
blank_issues_enabled: false
contact_links:
  - name: Security reporting policy
    url: https://github.com/xxtsxx/Vordr/blob/master/SECURITY.md
    about: >
      Report suspected vulnerabilities privately. Read the scope, response
      expectations, and coordinated-disclosure terms before submitting.
  - name: My antivirus flags Vordr
    url: https://github.com/xxtsxx/Vordr/blob/master/docs/ANTIVIRUS.md
    about: >
      Check the download and its hash, keep protection enabled, and learn how to
      submit a suspected false positive. A past warning does not explain every new one.
  - name: Verify a downloaded executable
    url: https://github.com/xxtsxx/Vordr/blob/master/docs/RELEASES.md
    about: >
      Compare the executable with its published hash or rebuild the exact tag
      with a matching toolchain. Investigate mismatches before using the file.
