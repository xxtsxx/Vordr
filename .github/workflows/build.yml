# Vordr CI - build + full test gate on every push/PR (and nightly).
#
# Runs tests\run_all.cmd, which is the same gate used locally:
#   1. dbg build + all 8 redteam fault-injection cases (0xFADE fail-fast codes)
#   2. strict release build (framecheck FATALs fail the build)
#   3. selftest ("all self-tests passed")
#   4. headless roundtrip: a PROBE_IO binary (a plain release refuses the path-
#      taking verbs) runs seedtest -> atgen -> zitest -> ... -> bktest/mactest/
#      rbtest/xctest/reload/cowrite -> ... -> vaultexportkat -> vaultexpattkat
#   5. cryptodiff: tests\verify_crypto.py independently recomputes every crypto
#      primitive (python stdlib + a self-validating pure-Python AES-256-GCM) and
#      cross-checks the published FIPS/RFC/NIST vectors against `vordr katreport`.
#   6. installer: builds the MSI from the restored release binary and verifies it
#      by COSTING the package through Windows Installer - component conditions,
#      64-bit registry components, the upgrade range.  Skips where makecab is
#      absent.  Added because two upgrade faults reached a live install while
#      these checks existed but were manual.
#
# windows-latest ships VS (ml64/link/rc), LLVM (clang/llvm-lib), and Python;
# Microsoft's built-in vswhere.exe + vcvarsall.bat puts the x64 toolchain on
# PATH the same way an "x64 Native Tools" prompt does, without third-party JS
# actions.  build.cmd's hardcoded SDK paths are a local-machine convenience -
# when they don't exist on the runner, rc/link fall back to the INCLUDE/LIB
# environment that vcvarsall sets, so the build works on both.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # G7.1: nightly re-run of the full gate (incl. the vfuzz/fuzzzip stages) at
    # 05:17 UTC, to catch flakiness the per-push run might miss.
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      # Native MSVC x64 developer environment via Microsoft's built-in vswhere +
      # vcvarsall.bat (zero third-party actions, zero Node.js dependency).
      - name: MSVC x64 environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -prerelease -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio with VC x64 tools not found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }
          $before = @{}
          [Environment]::GetEnvironmentVariables().GetEnumerator() | ForEach-Object {
            $before[$_.Key.ToUpperInvariant()] = [string]$_.Value
          }
          $env:_VCVARS = $vcvars
          $out = & cmd.exe /d /c 'call "%_VCVARS%" x64 >nul && set'
          $rc = $LASTEXITCODE
          Remove-Item Env:_VCVARS -ErrorAction SilentlyContinue
          if ($rc -ne 0) { throw "vcvarsall.bat failed (exit $rc)" }
          foreach ($line in $out) {
            $eq = $line.IndexOf('=')
            if ($eq -le 0) { continue }
            $k = $line.Substring(0, $eq)
            $v = $line.Substring($eq + 1)
            $ku = $k.ToUpperInvariant()
            if ($ku -eq 'PROMPT' -or $ku -eq '_VCVARS') { continue }
            if ($ku -eq 'PATH') {
              $oldEntries = @(($before['PATH'] -split ';') | Where-Object { $_ } | ForEach-Object { $_.TrimEnd('\').ToLowerInvariant() })
              $oldSet = [Collections.Generic.HashSet[string]]::new([string[]]$oldEntries)
              $newDirs = @($v -split ';' | Where-Object { $_ -and -not $oldSet.Contains($_.TrimEnd('\').ToLowerInvariant()) })
              # GITHUB_PATH prepends each line sequentially, so reverse to keep vcvarsall precedence.
              [array]::Reverse($newDirs)
              if ($newDirs.Count -gt 0) { $newDirs | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
            } elseif (-not $before.ContainsKey($ku) -or $before[$ku] -ne $v) {
              "$k=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Install ARM64 translator dependency (capstone)
        shell: cmd
        run: python -m pip install --disable-pip-version-check --no-input capstone==5.0.7

      - name: run_all gate (redteam + strict build + selftest + roundtrip + ARM64 + MSI)
        shell: cmd
        run: call tests\run_all.cmd

      # G7.2: also produce reproducible release builds (/Brepro + pinned PDB
      # path) for both x64 and ARM64 under strict static gates and print SHA-256.
      - name: reproducible release builds (x64 + ARM64)
        shell: cmd
        run: |
          call build.cmd release strict
          if errorlevel 1 exit /b 1
          call build_arm64.cmd release
          if errorlevel 1 exit /b 1

      # External-audit artifact: the raw crypto proof (vordr's katreport output +
      # the independent verifier's per-vector PASS/FAIL table) gated against the
      # release binary.
      - name: crypto proof artifact
        shell: cmd
        run: |
          mkdir crypto-proof 2>nul
          bin\vordr.exe katreport > crypto-proof\katreport.txt 2>&1
          if errorlevel 1 exit /b 1
          python tests\verify_crypto.py --exe bin\vordr.exe > crypto-proof\verify_crypto.txt 2>&1
          set VCRC=%ERRORLEVEL%
          type crypto-proof\verify_crypto.txt
          exit /b %VCRC%

      - name: build and verify universal MSI
        shell: cmd
        run: |
          del bin\vordr-*.msi >nul 2>nul
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\make_msi.ps1
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\verify_msi.ps1
          if errorlevel 1 exit /b 1

      - name: upload crypto proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: crypto-proof
          path: crypto-proof/
          if-no-files-found: ignore

      - name: upload release artifacts (x64 + ARM64 + universal MSI)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: vordr-release
          path: |
            bin/vordr.exe
            bin/vordr-arm64.exe
            bin/vordr-*.msi
            bin/SHA256SUMS.txt

      # run_all writes its logs to %TEMP%\vordr_runall - on the runner that is
      # C:\Users\runneradmin\AppData\Local\Temp, not runner.temp (D:\a\_temp), so the
      # upload used to find nothing.  Copy them into the workspace first.
      - name: collect stage logs on failure
        if: failure()
        shell: cmd
        run: xcopy /e /i /y "%TEMP%\vordr_runall" runall-logs >nul 2>nul & exit /b 0

      - name: upload stage logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: runall-logs
          path: runall-logs/
          if-no-files-found: ignore
